<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Flag strategy detection flow</title>
  <desc id="desc">A strong pole leads into a parallel channel against the trend and a breakout in the pole direction.</desc>
  <rect width="1200" height="520" rx="28" fill="#08111f"/>
  <g font-family="Inter,Arial,sans-serif" fill="#e5eefc">
    <text x="70" y="70" font-size="32" font-weight="700">Flag continuation model</text>
    <text x="70" y="108" font-size="17" fill="#94a3b8">Impulse → channel against the trend → directional breakout</text>
  </g>
  <g transform="translate(70 155)">
    <rect width="300" height="270" rx="20" fill="#0f1d31" stroke="#1e3a5f"/>
    <text x="28" y="42" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#e5eefc">1. Pole</text>
    <path d="M45 215 L95 190 L140 145 L190 102 L255 45" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round"/>
    <path d="M247 47 L258 38 L256 55" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>
    <text x="28" y="245" font-family="Inter,Arial,sans-serif" font-size="15" fill="#94a3b8">Strong move, high efficiency</text>
  </g>
  <path d="M390 290 H435" stroke="#64748b" stroke-width="3"/>
  <path d="M427 281 L438 290 L427 299" fill="none" stroke="#64748b" stroke-width="3"/>
  <g transform="translate(455 155)">
    <rect width="300" height="270" rx="20" fill="#0f1d31" stroke="#1e3a5f"/>
    <text x="28" y="42" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#e5eefc">2. Flag channel</text>
    <path d="M42 80 L260 145 M42 145 L260 210" stroke="#38bdf8" stroke-width="4"/>
    <path d="M48 103 L82 132 L116 108 L151 157 L188 135 L224 184 L257 163" fill="none" stroke="#e5eefc" stroke-width="3"/>
    <g fill="#38bdf8">
      <circle cx="48" cy="82" r="5"/><circle cx="116" cy="102" r="5"/><circle cx="188" cy="124" r="5"/>
      <circle cx="82" cy="157" r="5"/><circle cx="151" cy="177" r="5"/><circle cx="224" cy="199" r="5"/>
    </g>
    <text x="28" y="245" font-family="Inter,Arial,sans-serif" font-size="15" fill="#94a3b8">Parallel boundaries oppose pole</text>
  </g>
  <path d="M775 290 H820" stroke="#64748b" stroke-width="3"/>
  <path d="M812 281 L823 290 L812 299" fill="none" stroke="#64748b" stroke-width="3"/>
  <g transform="translate(840 155)">
    <rect width="290" height="270" rx="20" fill="#0f1d31" stroke="#1e3a5f"/>
    <text x="28" y="42" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#e5eefc">3. Breakout</text>
    <path d="M42 140 L168 178 M42 198 L168 236" stroke="#38bdf8" stroke-width="4"/>
    <path d="M45 163 L80 194 L115 171 L150 210 L176 165 L205 110 L250 48" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
    <circle cx="176" cy="165" r="8" fill="#f59e0b"/>
    <text x="28" y="245" font-family="Inter,Arial,sans-serif" font-size="15" fill="#94a3b8">Enter with the original trend</text>
  </g>
</svg>
